name: tests

on:
  push:
  pull_request:

jobs:
  unit:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.9", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Compile source
        run: python -m py_compile keep_awake.py tests/test_keep_awake.py

      - name: Check command help
        run: python keep_awake.py --help

      - name: Smoke test Windows API wrapper in dry-run mode
        if: runner.os == 'Windows'
        run: python keep_awake.py --hours 00:00-00:00 --dry-run --once --no-sleep-prevention --verbose
